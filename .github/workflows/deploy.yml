name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Confirm Northflank staging deploy is handled by Git integration
        run: echo "Northflank deploys the main branch through its Git integration."

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: verify-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render production deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
